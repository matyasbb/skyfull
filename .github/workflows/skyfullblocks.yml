name: Build SkyfullBlocks

# Builds the plugin JAR automatically in the cloud (no local setup needed).
# After it runs: open the run -> "Artifacts" -> download "SkyfullBlocks-jar",
# unzip, and drop SkyfullBlocks-1.0.0.jar into your server's /plugins folder.
# The build step locates pom.xml automatically (root or subfolder).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: |
          POM_DIR="$(dirname "$(find . -name pom.xml -not -path '*/target/*' | head -n1)")"
          echo ">> Found project in: $POM_DIR"
          cd "$POM_DIR"
          mvn -B package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SkyfullBlocks-jar
          path: '**/target/SkyfullBlocks-*.jar'
          if-no-files-found: error
